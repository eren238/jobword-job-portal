<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="../all-images/icon-images/icon.png" rel="shortcut icon" type="image/png">
  <link href="../styles/icons-1.11.3/font/bootstrap-icons.css" type="text/css" rel="stylesheet">
  <link href="../styles/contants.css?v=20261127" type="text/css" rel="stylesheet">
  <link href="../styles/main.css?v=20261127" type="text/css" rel="stylesheet">
  <link href="../styles/auth-portal.css?v=20261127" type="text/css" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', 'Poppins', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      box-sizing: border-box;
    }
    .student-portal-wrapper {
      width: 100%;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px 16px;
      box-sizing: border-box;
    }
    .student-portal-card {
      background-color: #ffffff;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
      border: 1px solid #e2e8f0;
      display: flex;
      width: 960px;
      max-width: 100%;
      min-height: 560px;
      padding: 14px;
      box-sizing: border-box;
      gap: 14px;
    }
    .portal-form-pane {
      flex: 1.18;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 36px 38px;
      box-sizing: border-box;
    }
    .portal-form-pane .form-header { margin-bottom: 24px; }
    .portal-form-pane .form-header .login-heading {
      font-size: 28px;
      font-weight: 700;
      color: #0f172a;
      margin: 0 0 6px 0;
      letter-spacing: -0.4px;
    }
    .portal-form-pane .form-header .login-subtext {
      font-size: 13.5px;
      color: #64748b;
      margin: 0;
    }
    .portal-login-form {
      display: flex;
      flex-direction: column;
      width: 100%;
    }
    .underline-field-group {
      position: relative;
      display: flex;
      flex-direction: column;
      margin-bottom: 20px;
    }
    .underline-field-group label {
      font-size: 12px;
      color: #64748b;
      margin-bottom: 4px;
      font-weight: 500;
      letter-spacing: 0.1px;
    }
    .underline-field-group label span { color: #ef4444; }
    .underline-field-group:focus-within label {
      color: #1e3a8a;
      font-weight: 600;
    }
    .underline-field-group .underline-input {
      width: 100%;
      height: 38px;
      border: none;
      border-bottom: 1.5px solid #cbd5e1;
      background: transparent;
      font-family: inherit;
      font-size: 14px;
      color: #0f172a;
      padding: 4px 0 6px 0;
      outline: none;
      box-sizing: border-box;
      border-radius: 0;
      transition: border-color 0.2s;
    }
    .underline-field-group .underline-input:focus { border-bottom-color: #1e3a8a; }
    .portal-login-btn {
      background-color: #1e3a8a;
      color: #ffffff;
      width: 100%;
      height: 46px;
      border: none;
      border-radius: 10px;
      font-size: 14.5px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px rgba(30, 58, 138, 0.2);
      transition: all 0.2s ease;
      margin-top: 8px;
      font-family: inherit;
    }
    .portal-login-btn:hover {
      background-color: #172554;
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(30, 58, 138, 0.28);
    }
    .signup-account-prompt {
      margin-top: 24px;
      font-size: 13.5px;
      color: #64748b;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .signup-account-prompt .signup-link-highlight {
      color: #1e3a8a;
      font-weight: 600;
      text-decoration: none;
    }
    .signup-account-prompt .signup-link-highlight:hover { text-decoration: underline; }
    .portal-hero-pane {
      flex: 0.95;
      background: linear-gradient(135deg, #0f1c3f 0%, #1e3a8a 100%);
      border-radius: 16px;
      padding: 42px 36px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
    }
    .school-hero-display {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 0;
    }
    .school-logo-badge {
      width: 124px;
      height: 124px;
      background: #ffffff;
      border-radius: 22px;
      padding: 14px;
      box-sizing: border-box;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 14px 32px rgba(0, 20, 60, 0.24), 0 2px 6px rgba(0, 0, 0, 0.08);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .school-logo-badge:hover {
      transform: translateY(-2px);
      box-shadow: 0 18px 38px rgba(0, 20, 60, 0.28);
    }
    .school-logo-badge .school-logo-image {
      width: 100%;
      height: 100%;
      max-height: 96px;
      max-width: 96px;
      object-fit: contain;
      display: block;
    }
    .portal-hero-text {
      margin-top: auto;
      padding-top: 16px;
    }
    .portal-hero-text .hero-portal-title {
      color: #ffffff;
      font-size: 24px;
      line-height: 1.3;
      margin: 0 0 6px 0;
    }
    .portal-hero-text .hero-portal-title .title-bold { font-weight: 700; }
    .portal-hero-text .hero-portal-title .title-light { font-weight: 300; }
    .portal-hero-text .hero-portal-subtitle {
      color: rgba(255, 255, 255, 0.88);
      font-size: 13px;
      margin: 0;
    }
    .alert-overlay, #alert.alert-overlay {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      background: rgba(15, 23, 42, 0.65) !important;
      backdrop-filter: blur(4px) !important;
      -webkit-backdrop-filter: blur(4px) !important;
      z-index: 999999 !important;
      display: none !important;
      justify-content: center !important;
      align-items: center !important;
      margin: 0 !important;
    }
    .alert-overlay.alertModal, #alert.alertModal { display: flex !important; }
    .alert-overlay .alert-container {
      background: #ffffff !important;
      width: 100% !important;
      max-width: 420px !important;
      border-radius: 18px !important;
      padding: 32px 28px !important;
      box-sizing: border-box !important;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25) !important;
      display: flex !important;
      flex-direction: column !important;
      align-items: center !important;
      text-align: center !important;
      gap: 18px !important;
      animation: modalPopIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) !important;
    }
    @keyframes modalPopIn {
      0% { transform: scale(0.85); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .alert-overlay .alert-container .image-wrapper {
      width: 90px !important;
      height: 90px !important;
      border-radius: 50% !important;
      overflow: hidden !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      margin: 0 auto !important;
      flex-shrink: 0 !important;
    }
    .alert-overlay .alert-container .image-wrapper img {
      width: 100% !important;
      height: 100% !important;
      object-fit: contain !important;
      display: block !important;
    }
    .alert-overlay .alert-container h4 {
      font-size: 15px !important;
      font-weight: 600 !important;
      color: #0f172a !important;
      margin: 0 !important;
      width: 100% !important;
      line-height: 1.5 !important;
      word-break: break-word !important;
      overflow-wrap: break-word !important;
      text-align: center !important;
    }
    .alert-overlay .alert-container .btn {
      background: #1e3a8a !important;
      color: #ffffff !important;
      min-height: 44px !important;
      height: 44px !important;
      padding: 0 32px !important;
      border-radius: 100px !important;
      border: none !important;
      cursor: pointer !important;
      font-size: 14px !important;
      font-weight: 600 !important;
      outline: none !important;
      transition: all 0.2s ease !important;
      display: inline-flex !important;
      align-items: center !important;
      justify-content: center !important;
      text-decoration: none !important;
      font-family: inherit;
    }
    .alert-overlay .alert-container .btn:hover {
      background: #172554 !important;
      transform: translateY(-1px) !important;
    }
    .alert-overlay .alert-container a { text-decoration: none !important; }
    @media screen and (max-width: 860px) {
      .student-portal-card {
        flex-direction: column !important;
        width: 100% !important;
        min-height: auto !important;
        padding: 16px !important;
      }
      .portal-hero-pane {
        order: -1 !important;
        padding: 24px 20px !important;
        min-height: 180px !important;
      }
      .school-logo-badge { width: 88px !important; height: 88px !important; }
      .school-logo-badge .school-logo-image { max-height: 70px !important; max-width: 70px !important; }
      .portal-form-pane { padding: 20px 12px !important; }
    }
  </style>
  <script src="../js/auth-reset.js?v=20261127"></script>
  <title>RemotelyAligned | Forgot Password</title>
</head>
<body>
  <!-- Modal Alert Container with Hostel-style GIF feedback -->
  <div class="alert-overlay" id="alert"></div>

  <div class="student-portal-wrapper">
    <div class="student-portal-card">
      <div class="portal-form-pane">
        <div class="form-header">
          <h1 class="login-heading">Forgot Password</h1>
          <p class="login-subtext">Enter your registered email address to receive your password reset OTP</p>
        </div>

        <form class="portal-login-form" action="" method="POST" onsubmit="event.preventDefault(); forgotPasswordHandle();">
          <div class="underline-field-group">
            <label for="emailAddress">Email Address</label>
            <input type="email" name="emailAddress" class="underline-input" id="emailAddress" placeholder="Enter your registered email address" required autocomplete="email" value="alexander.vance@executive.io">
          </div>

          <button type="submit" class="portal-login-btn" id="forgotPasswordBtnId" title="Reset-password">Proceed to reset password</button>
        </form>

        <div class="signup-account-prompt">
          <span>Remember your password?</span>
          <a href="login.html" class="signup-link-highlight">Back to Login</a>
        </div>
      </div>

      <div class="portal-hero-pane">
        <div class="school-hero-display">
          <div class="school-logo-badge">
            <img src="../all-images/icon-images/logo.png" alt="RemotelyAligned Logo" class="school-logo-image">
          </div>
        </div>

        <div class="portal-hero-text">
          <h2 class="hero-portal-title">
            <span class="title-bold">Remotely</span> <span class="title-light">Aligned Portal</span>
          </h2>
          <p class="hero-portal-subtitle">Recover and secure your executive portal account</p>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
